<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Flashcards</h1><p class="sub">Spaced repetition study decks</p></header>
  <main>
    <p id="error" class="error" hidden></p>

    <section id="view-decks">
      <form id="new-deck-form" class="row">
        <input id="new-deck-name" placeholder="New deck name" maxlength="60" required>
        <button type="submit">Create deck</button>
      </form>
      <div class="row wrap">
        <input id="search" type="search" placeholder="Search all cards (words, #tag)" aria-label="Search all cards">
        <button id="study-all">Study all due</button>
      </div>
      <div id="tag-cloud" class="counts"></div>
      <div id="search-results" hidden>
        <h3 id="search-title"></h3>
        <ul id="search-list" class="list"></ul>
      </div>
      <ul id="deck-list" class="list"></ul>
      <div class="row wrap">
        <button id="stats-btn" class="secondary">Stats</button>
        <button id="export-all" class="secondary">Export all (JSON)</button>
        <label class="button secondary">Import JSON<input id="import-json" type="file" accept=".json,application/json" hidden></label>
      </div>
      <p id="io-msg" class="muted" hidden></p>
    </section>

    <section id="view-stats" hidden>
      <div class="row between">
        <button id="stats-back" class="link">&larr; All decks</button>
        <h2>Stats</h2>
      </div>
      <div id="stats-tiles" class="summary"></div>
      <h3>Due forecast (next 14 days)</h3>
      <canvas id="forecast-chart" class="chart" width="680" height="180"></canvas>
      <h3>Reviews (last 14 days)</h3>
      <canvas id="history-chart" class="chart" width="680" height="180"></canvas>
    </section>

    <section id="view-deck" hidden>
      <div class="row between">
        <button id="back-to-decks" class="link">&larr; All decks</button>
        <h2 id="deck-title"></h2>
      </div>
      <div class="row between wrap">
        <div id="deck-counts" class="counts"></div>
        <button id="study-btn">Study</button>
      </div>
      <form id="new-card-form" class="card-form">
        <textarea id="card-front" placeholder="Front (question)" rows="2" required></textarea>
        <textarea id="card-back" placeholder="Back (answer)" rows="2" required></textarea>
        <input id="card-tags" placeholder="Tags (optional, e.g. verbs chapter1)">
        <button type="submit">Add card</button>
      </form>
      <ul id="card-list" class="list"></ul>
      <div class="row wrap">
        <button id="export-deck-json" class="secondary">Export JSON</button>
        <button id="export-deck-csv" class="secondary">Export CSV</button>
        <label class="button secondary">Import CSV<input id="import-csv" type="file" accept=".csv,text/csv" hidden></label>
      </div>
      <p id="deck-io-msg" class="muted" hidden></p>
    </section>

    <section id="view-review" hidden>
      <div class="row between">
        <button id="review-exit" class="link">&larr; End session</button>
        <span id="review-progress" class="muted"></span>
      </div>
      <div class="progress"><div id="review-bar"></div></div>
      <div id="review-card" class="review-card">
        <div id="review-front" class="review-front"></div>
        <div id="review-back" class="review-back" hidden></div>
      </div>
      <button id="reveal-btn" class="wide">Show answer <kbd>Space</kbd></button>
      <div id="grade-row" class="grade-row" hidden>
        <button class="grade again" data-grade="again">Again<small></small><kbd>1</kbd></button>
        <button class="grade hard" data-grade="hard">Hard<small></small><kbd>2</kbd></button>
        <button class="grade good" data-grade="good">Good<small></small><kbd>3</kbd></button>
        <button class="grade easy" data-grade="easy">Easy<small></small><kbd>4</kbd></button>
      </div>
    </section>

    <section id="view-summary" hidden>
      <h2>Session complete</h2>
      <div id="summary-stats" class="summary"></div>
      <div class="row">
        <button id="summary-again">Study more</button>
        <button id="summary-done" class="secondary">Done</button>
      </div>
    </section>
  </main>
  <script src="sm2.js"></script>
  <script src="store.js"></script>
  <script src="session.js"></script>
  <script src="stats.js"></script>
  <script src="io.js"></script>
  <script src="script.js"></script>
</body>
</html>
